name: Validate normalized history data

on:
  push:
    paths:
      - 'data/*.csv'
      - 'scripts/validate_normalized.py'
  pull_request:
    paths:
      - 'data/*.csv'
      - 'scripts/validate_normalized.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical datasets
        run: python scripts/validate_normalized.py
