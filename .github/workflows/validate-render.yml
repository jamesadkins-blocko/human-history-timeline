name: Validate Render Contract
on:
  push:
    paths:
      - 'scripts/render_timeline_svg.py'
      - 'scripts/test_render_contract.py'
      - 'docs/RENDER_CONTRACT.md'
  workflow_dispatch:
jobs:
  validate-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_render_contract.py
